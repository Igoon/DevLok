name: macos-runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  runtime:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install Homebrew runtimes
        run: brew install nginx php mysql
      - name: Build CLI
        run: go build -trimpath -o dl ./cmd/dl
      - name: Run macOS stack
        shell: bash
        run: |
          set -e
          project="$RUNNER_TEMP/devlok-mac-test"
          mkdir -p "$project/public"
          cat > "$project/.devlok.yaml" <<'YAML'
          schema: 1
          name: macdemo
          web:
            server: nginx
            root: public
            tld: test
            php: "8.4"
            https: false
          components:
            mysql: true
            phpmyadmin: true
          YAML
          printf '<?php echo "devlok-mac-ok";\n' > "$project/public/index.php"
          set +e
          ./dl up --path "$project" --skip-hosts --skip-trust >up.log 2>&1
          code=$?
          set -e
          cat up.log
          if [ $code -ne 0 ]; then
            msg=$(tail -n 30 up.log | tr '\n' ' ' | cut -c1-1500)
            echo "::error title=mac stack::$msg"
            for f in "$HOME/Library/Application Support/DevLok/logs/mysql/"*-error.log; do
              [ -f "$f" ] && { echo "--- $f"; tail -n 40 "$f"; }
            done
            ./dl status || true
            exit $code
          fi
          body=$(curl -fsS --retry 5 --retry-delay 1 http://127.0.0.1:8080/)
          echo "body=$body"
          test "$body" = "devlok-mac-ok"
          ./dl status
          ./dl db list --json
          pma=$(curl -fsS -H 'Host: phpmyadmin.test' http://127.0.0.1:8080/)
          echo "$pma" | grep -qi phpmyadmin
          ./dl down
