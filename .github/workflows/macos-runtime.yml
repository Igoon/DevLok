name: macos-runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install Homebrew runtimes
        run: brew install nginx php mysql
      - name: Build CLI
        run: go build -trimpath -o dl ./cmd/dl
      - name: Run macOS stack
        shell: bash
        run: |
          set -e
          trap 'rc=$?; if [ $rc -ne 0 ]; then echo "== FAILED rc=$rc =="; cat up.log 2>/dev/null || true; ./dl status || true; for f in "$HOME/Library/Application Support/DevLok/logs/nginx/"*.log "$HOME/Library/Application Support/DevLok/logs/php-error.log"; do [ -f "$f" ] && { echo "--- $f"; tail -n 40 "$f"; }; done; fi' EXIT
          project="$RUNNER_TEMP/devlok-mac-test"
          mkdir -p "$project/public"
          cat > "$project/.devlok.yaml" <<'YAML'
          schema: 1
          name: macdemo
          web:
            server: nginx
            root: public
            tld: test
            php: "8.4"
            https: false
          components:
            mysql: true
            phpmyadmin: true
          YAML
          printf '<?php echo "devlok-mac-ok";\n' > "$project/public/index.php"
          set +e
          ./dl up --path "$project" --skip-hosts --skip-trust >up.log 2>&1
          code=$?
          set -e
          cat up.log
          if [ $code -ne 0 ]; then
            msg=$(tail -n 30 up.log | tr '\n' ' ' | cut -c1-1500)
            echo "::error title=mac stack::$msg"
            for f in "$HOME/Library/Application Support/DevLok/logs/mysql/"*-error.log; do
              [ -f "$f" ] && { echo "--- $f"; tail -n 40 "$f"; }
            done
            ./dl status || true
            exit $code
          fi
          body=""
          for i in $(seq 1 20); do
            body=$(curl -fsS http://127.0.0.1:8080/ 2>/dev/null) && break
            sleep 1
          done
          echo "body=$body"
          test "$body" = "devlok-mac-ok"
          ./dl status
          if ! ./dl db list --json >db.log 2>&1; then
            cat db.log
            msg=$(tail -n 10 db.log | tr '\n' ' ' | cut -c1-1000)
            echo "::error title=mac db::$msg"
            exit 1
          fi
          pma=""
          for i in $(seq 1 10); do
            pma=$(curl -fsS -H 'Host: phpmyadmin.test' http://127.0.0.1:8080/ 2>/dev/null) && break
            sleep 1
          done
          if [ -z "$pma" ]; then
            echo "::error title=mac phpmyadmin::tidak dapat mengambil halaman phpMyAdmin"
            exit 1
          fi
          echo "$pma" | grep -qi phpmyadmin
          ./dl down
