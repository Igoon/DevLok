name: macos-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      - run: npm run build
        working-directory: desktop/frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build GUI
        working-directory: desktop
        run: wails build -clean
      - name: Package app
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -e
          app=$(find desktop/build -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "app bundle tidak ditemukan"
            find desktop/build -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          go build -trimpath -o desktop/build/bin/dl-helper ./cmd/dl-helper
          cp desktop/build/bin/dl-helper "$app/Contents/MacOS/dl-helper"
          chmod +x "$app/Contents/MacOS/dl-helper"
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            keychain=devlok-sign.keychain
            keychain_pass=devlok-sign
            security create-keychain -p "$keychain_pass" "$keychain"
            security default-keychain -s "$keychain"
            security unlock-keychain -p "$keychain_pass" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            echo "$APPLE_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/devlok.p12"
            security import "$RUNNER_TEMP/devlok.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain"
            identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application.*\)"/\1/p' | head -n 1)
            if [ -z "$identity" ]; then
              echo "::error title=macOS signing::Developer ID Application tidak ditemukan"
              exit 1
            fi
            codesign --force --options runtime --timestamp --sign "$identity" "$app/Contents/MacOS/dl-helper"
            codesign --force --options runtime --timestamp --sign "$identity" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/DevLok-macos-$ARCH.zip"
          staging=$(mktemp -d)
          cp -R "$app" "$staging/DevLok.app"
          ln -s /Applications "$staging/Applications"
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            status="Signed dan notarized."
          else
            status="Unsigned; Gatekeeper dapat memblokir."
          fi
          cat > "$staging/README.txt" <<EOF
          DevLok untuk macOS ($ARCH)

          Prasyarat:
            brew install nginx php mysql

          $status
          EOF
          hdiutil create -volname DevLok -srcfolder "$staging" -ov -format UDZO "dist/DevLok-macos-$ARCH.dmg"
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            if [ -z "$APPLE_API_KEY_P8_BASE64" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
              echo "::error title=macOS notarization::secret API key belum lengkap"
              exit 1
            fi
            echo "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool submit "dist/DevLok-macos-$ARCH.dmg" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple "dist/DevLok-macos-$ARCH.dmg"
            xcrun stapler validate "dist/DevLok-macos-$ARCH.dmg"
          fi
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: DevLok-macos-${{ matrix.arch }}
          path: |
            dist/DevLok-macos-${{ matrix.arch }}.zip
            dist/DevLok-macos-${{ matrix.arch }}.dmg
