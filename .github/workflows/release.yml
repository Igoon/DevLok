name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis, contoh v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"
      - run: choco install innosetup --no-progress -y
      - name: Build CLI
        run: |
          go build -trimpath -o build\bin\dl.exe ./cmd/dl
          go build -trimpath -o build\bin\dl-helper.exe ./cmd/dl-helper
      - name: Build GUI
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Path build\windows -Force | Out-Null
          Copy-Item -LiteralPath assets\app.ico -Destination build\windows\icon.ico -Force
          wails build -clean
      - name: Sign binaries
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { Write-Host "Signing dilewati: secret tidak tersedia."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "devlok-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe tidak ditemukan" }
          foreach ($f in @("build\bin\dl.exe", "build\bin\dl-helper.exe", "desktop\build\bin\devlok-gui.exe")) {
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $f
            if ($LASTEXITCODE -ne 0) { throw "sign gagal: $f" }
          }
          Remove-Item $pfx -Force
      - name: Package
        shell: powershell
        run: |
          try { .\scripts\build-release.ps1 -SkipBuild -Installer }
          catch {
            Write-Host "::error title=release package::$($_.Exception.Message)"
            throw
          }
      - name: Sign installer
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { Write-Host "Signing installer dilewati: secret tidak tersedia."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "devlok-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe tidak ditemukan" }
          $setup = Get-ChildItem dist\DevLok-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "installer tidak ditemukan" }
          & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "sign installer gagal" }
          Remove-Item $pfx -Force
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($setup.FullName + ".sha256", "$hash  $($setup.Name)`n", (New-Object Text.UTF8Encoding($false)))
      - name: Installer smoke test
        shell: powershell
        run: |
          $setup = Get-ChildItem dist\DevLok-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "installer tidak ditemukan" }
          $dir = Join-Path $env:RUNNER_TEMP "DevLokInstall"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          & "$dir\dl.exe" version
          if ($LASTEXITCODE -ne 0) { throw "dl version gagal" }
          $unins = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          if ($unins) {
            $u = Start-Process -FilePath $unins.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
            if ($u.ExitCode -ne 0) { throw "uninstaller exit $($u.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DevLok-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: DevLok ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || (github.event_name == 'workflow_dispatch' && contains(inputs.tag, '-')) }}
          fail_on_unmatched_files: false
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
  macos:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      - run: npm run build
        working-directory: desktop/frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build GUI
        working-directory: desktop
        run: wails build -clean
      - name: Package app
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -e
          app=$(find desktop/build -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "app bundle tidak ditemukan"
            find desktop/build -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          go build -trimpath -o desktop/build/bin/dl-helper ./cmd/dl-helper
          cp desktop/build/bin/dl-helper "$app/Contents/MacOS/dl-helper"
          chmod +x "$app/Contents/MacOS/dl-helper"
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            keychain=devlok-sign.keychain
            keychain_pass=devlok-sign
            security create-keychain -p "$keychain_pass" "$keychain"
            security default-keychain -s "$keychain"
            security unlock-keychain -p "$keychain_pass" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            echo "$APPLE_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/devlok.p12"
            security import "$RUNNER_TEMP/devlok.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain"
            identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application.*\)"/\1/p' | head -n 1)
            if [ -z "$identity" ]; then
              echo "::error title=macOS signing::Developer ID Application tidak ditemukan"
              exit 1
            fi
            codesign --force --options runtime --timestamp --sign "$identity" "$app/Contents/MacOS/dl-helper"
            codesign --force --options runtime --timestamp --sign "$identity" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/DevLok-macos-$ARCH.zip"
          staging=$(mktemp -d)
          cp -R "$app" "$staging/DevLok.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname DevLok -srcfolder "$staging" -ov -format UDZO "dist/DevLok-macos-$ARCH.dmg"
          rm -rf "$staging"
          shasum -a 256 "dist/DevLok-macos-$ARCH.dmg" > "dist/DevLok-macos-$ARCH.dmg.sha256"
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            if [ -z "$APPLE_API_KEY_P8_BASE64" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
              echo "::error title=macOS notarization::secret API key belum lengkap"
              exit 1
            fi
            echo "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool submit "dist/DevLok-macos-$ARCH.dmg" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple "dist/DevLok-macos-$ARCH.dmg"
            xcrun stapler validate "dist/DevLok-macos-$ARCH.dmg"
          fi
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: DevLok-macos-${{ matrix.arch }}
          path: |
            dist/DevLok-macos-${{ matrix.arch }}.zip
            dist/DevLok-macos-${{ matrix.arch }}.dmg
            dist/DevLok-macos-${{ matrix.arch }}.dmg.sha256
      - name: Publish macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: DevLok ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') || (github.event_name == 'workflow_dispatch' && contains(inputs.tag, '-')) }}
          fail_on_unmatched_files: false
          files: |
            dist/DevLok-macos-${{ matrix.arch }}.zip
            dist/DevLok-macos-${{ matrix.arch }}.dmg
            dist/DevLok-macos-${{ matrix.arch }}.dmg.sha256
  manifest:
    needs: [windows, macos]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build runtime registry payload
        run: go run ./cmd/devlok-release registries -out runtimes.json
      - name: Build and sign update manifest
        shell: powershell
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          trap { Write-Host "::error title=manifest::$($_.Exception.Message)"; exit 1 }
          function Get-Sha($file) { (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $setup = Get-ChildItem artifacts -Recurse -Filter "DevLok-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer Windows tidak ditemukan" }
          $ver = $setup.BaseName -replace '^DevLok-Setup-', ''
          $base = "https://github.com/Igoon/DevLok/releases/download/$env:TAG"
          $payloadPath = Join-Path $PWD "update-payload.json"
          $pargs = @("payload", "-version", $ver, "-url", "$base/$($setup.Name)", "-sha256", (Get-Sha $setup.FullName),
            "-severity", "feature", "-notes", "DevLok $ver",
            "-published-at", (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"),
            "-runtimes", "runtimes.json", "-out", $payloadPath)
          $arm = Get-ChildItem artifacts -Recurse -Filter "DevLok-macos-arm64.dmg" | Select-Object -First 1
          if ($arm) { $pargs += @("-macos-arm64-url", "$base/$($arm.Name)", "-macos-arm64-sha256", (Get-Sha $arm.FullName)) }
          $intel = Get-ChildItem artifacts -Recurse -Filter "DevLok-macos-intel.dmg" | Select-Object -First 1
          if ($intel) { $pargs += @("-macos-intel-url", "$base/$($intel.Name)", "-macos-intel-sha256", (Get-Sha $intel.FullName)) }
          & go run ./cmd/devlok-release @pargs
          if ($LASTEXITCODE -ne 0) { throw "payload manifest gagal" }
          if (-not $env:UPDATE_SIGNING_KEY) { Write-Host "Manifest signing dilewati: secret tidak tersedia."; exit 0 }
          try { $keyData = [Convert]::FromBase64String($env:UPDATE_SIGNING_KEY.Trim()) }
          catch { Write-Host "::error title=manifest key::$($_.Exception.Message)"; exit 1 }
          if ($keyData.Length -notin 32, 64) { Write-Host "::error title=manifest key::panjang key $($keyData.Length) byte, harus 32 atau 64"; exit 1 }
          $keyPath = Join-Path $env:RUNNER_TEMP "update-signing.key"
          Set-Content -LiteralPath $keyPath -Value ([Convert]::ToBase64String($keyData)) -NoNewline -Encoding ascii
          $signOut = & go run ./cmd/devlok-release sign -key $keyPath -payload $payloadPath -out "dist/updates.json" 2>&1
          $signOut
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=manifest sign::$($signOut -join ' ')"; exit 1 }
          Remove-Item $keyPath, $payloadPath -Force
      - name: Publish update manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/updates.json
          fail_on_unmatched_files: false
  verify-update:
    needs: manifest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build old client
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path tmp -Force | Out-Null
          go build -trimpath -ldflags "-X devlok/internal/version.Version=0.0.1-dev" -o tmp\dl.exe ./cmd/dl
      - name: Verify update from old version
        shell: powershell
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $latest = ((& .\tmp\dl.exe update --json | Out-String | ConvertFrom-Json).data.app_update.latest)
          if (-not $latest) { throw "update aplikasi tidak terdeteksi" }
          if ("v$latest" -ne $env:TAG) { throw "update $latest tidak cocok dengan tag $env:TAG" }
          & .\tmp\dl.exe update download
          if ($LASTEXITCODE -ne 0) { throw "download update gagal" }
          $setup = Get-ChildItem "$env:USERPROFILE\.devlok\cache\updates" -Filter "*$latest*.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer update tidak ditemukan" }
          $dir = Join-Path $env:RUNNER_TEMP "DevLokUpdateE2E"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer update exit $($p.ExitCode)" }
          $installed = (& "$dir\dl.exe" version).ToString()
          if ($installed -notmatch [regex]::Escape($latest)) { throw "versi terpasang tidak cocok: $installed" }
          $unins = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          if ($unins) {
            $u = Start-Process -FilePath $unins.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
            if ($u.ExitCode -ne 0) { throw "uninstaller exit $($u.ExitCode)" }
          }