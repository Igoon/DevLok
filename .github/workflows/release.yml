name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis, contoh v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"
      - run: choco install innosetup --no-progress -y
      - name: Build CLI
        run: |
          go build -trimpath -o build\bin\dl.exe ./cmd/dl
          go build -trimpath -o build\bin\dl-helper.exe ./cmd/dl-helper
      - name: Build GUI
        working-directory: desktop
        run: wails build -clean
      - name: Package
        shell: powershell
        run: |
          try { .\scripts\build-release.ps1 -SkipBuild -Installer }
          catch {
            Write-Host "::error title=release package::$($_.Exception.Message)"
            throw
          }
      - name: Installer smoke test
        shell: powershell
        run: |
          $setup = Get-ChildItem dist\DevLok-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "installer tidak ditemukan" }
          $dir = Join-Path $env:RUNNER_TEMP "DevLokInstall"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          & "$dir\dl.exe" version
          if ($LASTEXITCODE -ne 0) { throw "dl version gagal" }
          $unins = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          if ($unins) {
            $u = Start-Process -FilePath $unins.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
            if ($u.ExitCode -ne 0) { throw "uninstaller exit $($u.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DevLok-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: DevLok ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || (github.event_name == 'workflow_dispatch' && contains(inputs.tag, '-')) }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256