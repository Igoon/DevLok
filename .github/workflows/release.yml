name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis, contoh v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"
      - run: choco install innosetup --no-progress -y
      - name: Build CLI
        run: |
          go build -trimpath -o build\bin\dl.exe ./cmd/dl
          go build -trimpath -o build\bin\dl-helper.exe ./cmd/dl-helper
      - name: Build GUI
        working-directory: desktop
        run: wails build -clean
      - name: Package
        shell: powershell
        run: |
          try { .\scripts\build-release.ps1 -SkipBuild -Installer }
          catch {
            Write-Host "::error title=release package::$($_.Exception.Message)"
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DevLok-windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content (Get-ChildItem dist\DevLok -Directory | Select-Object -First 1).FullName\VERSION).Trim()
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG tidak cocok dengan versi aplikasi v$version" }
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|exe|sha256)$' } | ForEach-Object { $_.FullName }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            $out = gh release upload $env:TAG $assets --clobber 2>&1
          } elseif ($env:TAG -match '-') {
            $out = gh release create $env:TAG $assets --title "DevLok $env:TAG" --generate-notes --prerelease 2>&1
          } else {
            $out = gh release create $env:TAG $assets --title "DevLok $env:TAG" --generate-notes 2>&1
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=publish release::$($out -join ' ')"
            exit 1
          }
          $out