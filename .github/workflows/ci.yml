name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      - run: npm run build
        working-directory: desktop/frontend
      - run: go vet ./...
      - shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Test
        shell: bash
        run: |
          set +e
          go test ./... -count=1 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            { echo '```'; tail -n 120 test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            msg=$(tail -n 40 test.log | tr '\n' ' ' | cut -c1-1500)
            echo "::error title=go test failure::$msg"
          fi
          exit $code
      - if: runner.os == 'macOS'
        run: go test ./... -race -count=1
      - run: go build ./...
